<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mock Chat</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 20px; background: #f6f6f6; }
  .msg { padding: 10px; margin: 8px 0; border-radius: 8px; background: #fff; }
  .user { background: #dbeafe; }
  #composer:not([hidden]) { display: flex; gap: 8px; margin-top: 20px; }
  textarea { flex: 1; height: 60px; }
</style>
</head>
<body>
<h1>Mock Chat</h1>
<div id="models">
  <button id="model-btn" aria-haspopup="menu">Fast 1</button>
  <button id="think" aria-pressed="false">Think</button>
  <div id="model-menu" hidden>
    <div role="menuitem">Fast 1<br><small>Quick answers</small></div>
    <div role="menuitem">Smart 2<br><small>Best for hard tasks</small></div>
    <div role="menuitem" id="more">More models</div>
    <div id="legacy" hidden><div role="menuitem">Legacy 0.9</div></div>
  </div>
</div>
<div id="auth"></div>
<div id="log"></div>
<div id="composer" hidden>
  <button id="attach" title="Attach">+</button>
  <textarea id="prompt" placeholder="Message"></textarea>
  <button id="send">Send</button>
  <button id="stop" hidden>Stop</button>
</div>
<div id="atts"></div>
<script>
  const loggedIn = document.cookie.includes('mock_auth=1');
  const auth = document.getElementById('auth');
  if (!loggedIn) {
    auth.innerHTML = '<button id="login">Log in</button>';
    document.getElementById('login').onclick = () => { document.cookie = 'mock_auth=1; path=/'; location.reload(); };
  } else {
    auth.textContent = 'Logged in as tester';
    document.getElementById('composer').hidden = false;
  }
  // ---- model menu (with a "More models" submenu) and a Think toggle ----
  const menu = document.getElementById('model-menu');
  document.getElementById('model-btn').onclick = () => { menu.hidden = !menu.hidden; document.getElementById('legacy').hidden = true; };
  document.getElementById('more').onclick = (e) => { e.stopPropagation(); document.getElementById('legacy').hidden = false; };
  menu.addEventListener('click', (e) => {
    const item = e.target.closest('[role="menuitem"]');
    if (!item || item.id === 'more') return;
    document.getElementById('model-btn').textContent = item.firstChild.textContent.trim();
    menu.hidden = true;
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') menu.hidden = true; });
  const think = document.getElementById('think');
  think.onclick = () => think.setAttribute('aria-pressed', think.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');

  // ---- attachments: static file input (?static-input), attach button (file chooser), or drag & drop ----
  const attached = [];
  const sendBtn = document.getElementById('send');
  function addFiles(list) {
    const files = [...list];
    if (!files.length) return;
    const up = document.createElement('div');
    up.className = 'uploading';
    up.textContent = 'Uploading…';
    document.getElementById('atts').appendChild(up);
    sendBtn.disabled = true;
    setTimeout(async () => {
      for (const f of files) {
        const text = /^text\/|json/.test(f.type) ? (await f.text()).slice(0, 40) : null;
        attached.push({ name: f.name, size: f.size, text });
        const chip = document.createElement('span');
        chip.className = 'att';
        chip.textContent = f.name;
        document.getElementById('atts').appendChild(chip);
      }
      up.remove();
      sendBtn.disabled = false;
    }, 900);
  }
  if (location.search.includes('static-input')) {
    const fi = document.createElement('input');
    fi.type = 'file'; fi.multiple = true; fi.hidden = true;
    fi.onchange = () => addFiles(fi.files);
    document.body.appendChild(fi);
  }
  document.getElementById('attach').onclick = () => {
    const fi = document.createElement('input');
    fi.type = 'file'; fi.multiple = true;
    fi.onchange = () => addFiles(fi.files);
    fi.click();
  };
  document.getElementById('prompt').addEventListener('drop', (e) => { e.preventDefault(); addFiles(e.dataTransfer.files); });

  const log = document.getElementById('log');
  const prompt = document.getElementById('prompt');
  const stop = document.getElementById('stop');
  let stopped = false;
  stop.onclick = () => { stopped = true; };
  async function send() {
    const text = prompt.value.trim();
    if (!text) return;
    prompt.value = '';
    const u = document.createElement('div');
    u.className = 'msg user';
    u.textContent = text;
    log.appendChild(u);
    await new Promise(r => setTimeout(r, 400));
    const a = document.createElement('div');
    a.className = 'msg assistant';
    a.innerHTML = '<div class="status">Thinking…</div><div class="md"></div><button>Copy</button>';
    log.appendChild(a);
    const md = a.querySelector('.md');
    stop.hidden = false;
    stopped = false;
    // like Claude: animated status words before the answer appears
    const status = a.querySelector('.status');
    for (const w of ['Reckoning…', 'Pondering…', 'Claude is thinking']) { await new Promise(r => setTimeout(r, 250)); status.textContent = w; }
    status.remove();
    const fileInfo = attached.length ? ' Files: ' + attached.map(f => `${f.name}[${f.size}b${f.text ? ':' + f.text.replace(/\s+/g, '_') : ''}]`).join(',') : '';
    attached.length = 0;
    document.getElementById('atts').innerHTML = '';
    const modelInfo = ` [model: ${document.getElementById('model-btn').textContent}, think: ${think.getAttribute('aria-pressed') === 'true' ? 'on' : 'off'}]`;
    const words = ('Hello from the **mock** model. You said: ' + text.slice(0, 2000).replace(/\s+/g, ' ') + fileInfo + modelInfo).split(' ');
    let html = '';
    for (const w of words) {
      if (stopped) break;
      html += (html ? ' ' : '') + w.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      md.innerHTML = '<p>' + html + '</p>';
      await new Promise(r => setTimeout(r, 25));
    }
    md.innerHTML += '<ul><li>one</li><li>two</li></ul><pre><code class="language-js">console.log(1 &lt; 2);\n</code></pre>';
    await new Promise(r => setTimeout(r, 300));
    stop.hidden = true;
  }
  document.getElementById('send').onclick = send;
  prompt.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
</script>
</body>
</html>
